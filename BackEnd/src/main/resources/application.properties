spring.application.name=FreightGrid

# ─── Environment Variable Import ───────────────────────────────────────────────
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# OAUTH 2.0 RESOURCE SERVER
# ===================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${OAUTH_AUDIENCE}

# ─── Neon DB Datasource (HikariCP) ─────────────────────────────────────────────
# DB_JDBC_URL must use jdbc:postgresql:// prefix (not libpq postgresql://)
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP – keep pool small for Neon serverless connection limits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Security (Sprint 1 – DB Layer Only) ───────────────────────────────────────
# Disable OAuth2 resource server and security auto-config until the security
# sprint. This allows the app to boot and seed the DB without an issuer URI.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# ─── Spring AI (stub – Groq endpoint wired in AI sprint) ───────────────────────
spring.ai.openai.api-key=${GROQ_API_KEY:placeholder}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Debug logging to show the judges the swarm thinking in the terminal
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
